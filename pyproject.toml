[project]
name = "swiftadapt-experiments"
version = "0.1.0"
description = "Reproducible experiments for the SWIFTADAPT research paper"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "timm>=0.9.10",
  "datasets>=2.16.1",
  "transformers>=4.35.2",
  "einops>=0.7.0",
  "fvcore>=0.1.5.post20221221",
  "pynvml>=11.5.0",
  "matplotlib>=3.8.2",
  "seaborn>=0.13.0",
  "pandas>=2.1.2",
  "psutil>=5.9.6",
  "PyYAML>=6.0.1",
  "tqdm>=4.66.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
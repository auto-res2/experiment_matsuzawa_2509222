datasets:
  imagenet_c:
    hf_id: ang9867/ImageNet-C
    split: test
    take: null
  cifar10_c:
    hf_id: robro/cifar10-c-parquet
    split: train
    take: null
  cifar100_c:
    hf_id: randall-lab/cifar100-c
    split: test
    take: null
  imagenet_vid:
    hf_id: guanxiongsun/imagenetvid
    split: validation
    take: 30000
models:
  - timm/resnet50.a1_in1k
  - timm/convnext_tiny.fb_in22k_ft_in1k
  - timm/vit_base_patch16_224.augreg2_in21k_ft_in1k
batch_size:
  imagenet_c: 64
  cifar10_c: 256
  cifar100_c: 256
  imagenet_vid: 1
las_decay: 0.1
tau_skip_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
fine_tune:
  interval: 128
  steps: 4
severity_levels: [1, 2, 3, 4, 5]
smoke: false